name: Bot Trading 5m

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot-5m:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: pip install requests

      - name: Vérification des secrets Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          if not os.getenv('BOT_TOKEN') or not os.getenv('CHAT_ID'):
              raise SystemExit('BOT_TOKEN et CHAT_ID doivent être définis dans les secrets GitHub.')
          print('Secrets Telegram OK')
          PY

      - name: Lancement du script 5m
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot_5m.py
