name: Bot Trading Alertes

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Restaurer la mémoire des alertes
        uses: actions/cache/restore@v4
        with:
          path: sent_alerts.json
          key: sent-alerts-bot-${{ github.run_id }}
          restore-keys: |
            sent-alerts-bot-

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: pip install requests

      - name: Vérification des secrets Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          if not os.getenv('BOT_TOKEN') or not os.getenv('CHAT_ID'):
              raise SystemExit('BOT_TOKEN et CHAT_ID doivent être définis dans les secrets GitHub.')
          print('Secrets Telegram OK')
          PY

      - name: Lancement du script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: Sauvegarder la mémoire des alertes
        if: always()
        uses: actions/cache/save@v4
        with:
          path: sent_alerts.json
          key: sent-alerts-bot-${{ github.run_id }}
